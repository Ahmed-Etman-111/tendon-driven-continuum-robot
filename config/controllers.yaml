controller_manager:
  ros__parameters:
    update_rate: 30  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    continuum_controller:
      type: position_controllers/JointGroupPositionController

joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true


continuum_controller:
  ros__parameters:
    use_sim_time: true 
    joints:
      - pitch_joint_1
      - yaw_joint_1
      - contraction_joint_1
      - pitch_joint_2
      - yaw_joint_2
      - contraction_joint_2
      - pitch_joint_3
      - yaw_joint_3
      - contraction_joint_3
      - pitch_joint_4
      - yaw_joint_4
      - contraction_joint_4
      - pitch_joint_5
      - yaw_joint_5
      - contraction_joint_5
      - pitch_joint_6
      - yaw_joint_6
      - contraction_joint_6
      - pitch_joint_7
      - yaw_joint_7
      - contraction_joint_7
      - pitch_joint_8
      - yaw_joint_8
      - contraction_joint_8
      - pitch_joint_9
      - yaw_joint_9
      - contraction_joint_9
      - pitch_joint_10
      - yaw_joint_10
      - contraction_joint_10


